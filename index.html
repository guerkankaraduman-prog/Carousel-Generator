<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carousel Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--surface:#18181f;--surface2:#22222c;
  --border:rgba(255,255,255,0.08);--border-md:rgba(255,255,255,0.14);
  --text:#f0f0f0;--text-2:#9494a8;--text-3:#5a5a70;
  --accent:#7c6cfc;--accent-bg:rgba(124,108,252,0.12);
  --green:#22c55e;--green-bg:rgba(34,197,94,0.12);
  --danger:#e05260;--radius:10px;--radius-sm:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--surface);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;user-select:none}
.topbar-logo{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar-logo span{color:var(--accent);font-size:20px}
.aff-badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;background:var(--green-bg);color:var(--green);border:0.5px solid rgba(34,197,94,0.3)}
.topbar-sep{flex:1}
.topbar-count{font-size:12px;color:var(--text-3)}
.topbar-btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;border:0.5px solid var(--border-md);background:transparent;color:var(--text-2);cursor:pointer;transition:all .15s}
.topbar-btn:hover{background:var(--surface2);color:var(--text)}
.workspace{display:grid;grid-template-columns:290px 1fr 300px;flex:1;overflow:hidden;height:calc(100vh - 52px);min-height:0}
.sidebar{background:var(--surface);border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-title{padding:14px 16px 10px;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--text-3)}
.slides-list{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:4px}
.slides-list::-webkit-scrollbar{width:3px}
.slides-list::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:2px}
.slide-thumb{border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s;background:transparent}
.slide-thumb:hover{border-color:var(--border-md);background:var(--surface2)}
.slide-thumb.active{border-color:var(--accent);background:var(--accent-bg)}
.thumb-num{font-size:10px;font-weight:500;color:var(--text-3);min-width:16px}
.slide-thumb.active .thumb-num{color:var(--accent)}
.thumb-preview{width:44px;height:36px;border-radius:4px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.thumb-img-dot{position:absolute;bottom:2px;right:2px;width:8px;height:8px;background:var(--green);border-radius:50%;border:1.5px solid var(--surface)}
.thumb-link-dot{position:absolute;bottom:2px;left:2px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:1.5px solid var(--surface)}
.thumb-meta{flex:1;min-width:0}
.thumb-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.thumb-type{font-size:10px;color:var(--text-3);margin-top:1px}
.thumb-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.slide-thumb:hover .thumb-actions{opacity:1}
.tact{background:none;border:none;cursor:pointer;color:var(--text-3);padding:3px 5px;border-radius:4px;font-size:12px;transition:all .15s;line-height:1}
.tact:hover{color:var(--danger);background:rgba(224,82,96,.12)}
.tact.mv:hover{color:var(--accent);background:var(--accent-bg)}
.add-btn{margin:4px 10px 14px;padding:9px;border:0.5px dashed var(--border-md);background:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.add-btn:hover{background:var(--surface2);color:var(--text-2)}
.canvas-area{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:auto;padding:32px}
.canvas-nav{display:flex;align-items:center;gap:16px}
.nav-arrow{background:var(--surface);border:0.5px solid var(--border-md);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text-2);transition:all .15s;flex-shrink:0}
.nav-arrow:hover:not([disabled]){background:var(--surface2);color:var(--text)}
.nav-arrow[disabled]{opacity:.25;cursor:default;pointer-events:none}
.slide-frame{border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 0.5px rgba(255,255,255,.06);flex-shrink:0}
.dots{display:flex;align-items:center;gap:6px}
.dot{height:4px;border-radius:2px;background:var(--border-md);cursor:pointer;transition:all .2s;width:8px}
.dot.active{width:24px;background:var(--accent)}
.props-panel{background:var(--surface);border-left:0.5px solid var(--border);overflow-y:scroll;display:flex;flex-direction:column;height:100%;min-height:0}
.props-panel::-webkit-scrollbar{width:4px}
.props-panel::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:2px}
.props-panel::-webkit-scrollbar-track{background:transparent}
.psec{padding:14px 16px;border-bottom:0.5px solid var(--border)}
.psec:last-child{border-bottom:none;padding-bottom:20px}
.psec-title{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-bottom:12px}
.psec.aff{border:0.5px solid rgba(34,197,94,.25);border-radius:var(--radius-sm);margin:10px;padding:14px;margin-bottom:24px}
.layout-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.lbtn{padding:7px 4px;border:0.5px solid var(--border);border-radius:var(--radius-sm);background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;color:var(--text-3);transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.lbtn:hover{border-color:var(--border-md);color:var(--text-2);background:var(--surface2)}
.lbtn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.lbtn.prod.active{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.lic{width:28px;height:20px;border:1.5px solid currentColor;border-radius:2px;opacity:.6;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700}
.color-row{display:flex;gap:7px;flex-wrap:wrap}
.cdot{width:24px;height:24px;border-radius:50%;cursor:pointer;transition:transform .15s;position:relative;flex-shrink:0}
.cdot:hover{transform:scale(1.12)}
.cdot.active::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent)}
.format-row{display:flex;gap:6px}
.fbtn{flex:1;padding:6px 4px;border:0.5px solid var(--border);border-radius:var(--radius-sm);background:transparent;font-family:'DM Sans',sans-serif;font-size:10px;color:var(--text-3);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.fbtn:hover{border-color:var(--border-md);color:var(--text-2)}
.fbtn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.fpreview{border:1.5px solid currentColor;border-radius:2px;opacity:.6}
.fgroup{margin-bottom:10px}
.flabel{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);display:block;margin-bottom:5px}
.finput{width:100%;font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s;resize:vertical}
.finput:focus{border-color:var(--accent)}
.finput::placeholder{color:var(--text-3)}
.finput.link{border-color:rgba(34,197,94,.3)}
.finput.link:focus{border-color:var(--green)}
.img-drop{border:0.5px dashed rgba(34,197,94,.35);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;transition:all .15s;background:rgba(34,197,94,.04);position:relative;overflow:hidden}
.img-drop:hover{border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.08)}
.img-drop.has{padding:6px;border-style:solid}
.img-drop img{width:100%;border-radius:5px;display:block;max-height:120px;object-fit:cover}
.img-ilabel{font-size:12px;color:var(--green);margin-bottom:3px;font-weight:500}
.img-isub{font-size:10px;color:var(--text-3)}
.img-rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2}
.img-rm:hover{background:var(--danger)}
.link-preview{margin-top:6px;padding:7px 10px;background:var(--surface2);border:0.5px solid rgba(34,197,94,.2);border-radius:var(--radius-sm);font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:6px;word-break:break-all}
.lpdot{width:6px;height:6px;background:var(--green);border-radius:50%;flex-shrink:0}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.toggle-lbl{font-size:12px;color:var(--text-2)}
.tog{position:relative;width:36px;height:20px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:var(--surface2);border-radius:10px;border:0.5px solid var(--border-md);cursor:pointer;transition:.2s}
.tog-sl::before{content:'';position:absolute;height:14px;width:14px;left:2px;top:2px;background:var(--text-3);border-radius:50%;transition:.2s}
.tog input:checked+.tog-sl{background:var(--green-bg);border-color:rgba(34,197,94,.4)}
.tog input:checked+.tog-sl::before{transform:translateX(16px);background:var(--green)}
/* slide layouts */
.sw{width:100%;height:100%;position:relative;overflow:hidden;font-family:'DM Sans',sans-serif}
.snum{position:absolute;top:16px;right:16px;font-size:10px;letter-spacing:1px;opacity:.3;z-index:3}
.sbgi{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.sbgo{position:absolute;inset:0;z-index:1}
.scz{position:relative;z-index:2;width:100%;height:100%}
.sc{display:flex;flex-direction:column;justify-content:flex-end;padding:40px 44px;height:100%}
.sc .ey{font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;opacity:.7;margin-bottom:14px}
.sc .hl{font-family:'Playfair Display',serif;font-weight:700;line-height:1.1;margin-bottom:14px}
.sc .su{font-weight:300;line-height:1.5;opacity:.75}
.dcc{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.sct{display:flex;flex-direction:column;padding:38px 44px;height:100%}
.sct .lb{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.4;margin-bottom:16px}
.sct .br{height:2px;border-radius:1px;width:36px;margin-bottom:18px;opacity:.5}
.sct .hd{font-family:'Playfair Display',serif;font-weight:700;line-height:1.2;margin-bottom:14px}
.sct .bt{font-size:14px;line-height:1.7;opacity:.75;font-weight:300;flex:1}
.sprod{display:flex;flex-direction:column;height:100%}
.sprod .pi{flex:1;background-size:cover;background-position:center;position:relative;overflow:hidden;min-height:50%}
.sprod .pip{width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:.2;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.sprod .pbadge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.sprod .pinfo{padding:20px 24px;display:flex;flex-direction:column;gap:6px}
.sprod .pbrand{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.5}
.sprod .pname{font-family:'Playfair Display',serif;font-weight:700;line-height:1.2}
.sprod .pprice{font-size:18px;font-weight:500}
.sprod .pold{font-size:12px;text-decoration:line-through;opacity:.4;margin-left:6px}
.sprod .pcta{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:40px;font-size:12px;font-weight:500;margin-top:4px;align-self:flex-start;text-decoration:none;cursor:pointer}
.sst{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px;height:100%;gap:4px}
.sst .big{font-family:'Playfair Display',serif;font-weight:700;line-height:1}
.sst .lb{font-size:13px;opacity:.5;font-weight:300;letter-spacing:1px}
.sst .desc{font-size:13px;line-height:1.65;opacity:.75;max-width:78%;margin-top:10px;font-weight:300}
.sqt{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 44px;height:100%}
.sqt .qm{font-family:'Playfair Display',serif;font-size:88px;line-height:.75;opacity:.12;margin-bottom:18px}
.sqt .qt{font-family:'Playfair Display',serif;font-size:21px;line-height:1.42;font-style:italic;margin-bottom:18px}
.sqt .au{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;opacity:.4}
.scta{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px;height:100%}
.scta .in{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.4;margin-bottom:16px}
.scta .ti{font-family:'Playfair Display',serif;font-weight:700;line-height:1.2;margin-bottom:22px}
.scta .pill{display:inline-block;padding:11px 28px;border-radius:40px;font-size:13px;font-weight:500;margin-bottom:12px;text-decoration:none;cursor:pointer}
.scta .hnd{font-size:12px;opacity:.4}
.sls{display:flex;flex-direction:column;padding:36px 44px;height:100%}
.sls .lb{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.4;margin-bottom:14px}
.sls .hd{font-family:'Playfair Display',serif;font-weight:700;line-height:1.2;margin-bottom:18px}
.sls .its{display:flex;flex-direction:column;gap:10px;flex:1}
.sls .it{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;opacity:.8;font-weight:300}
.sls .idot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.affbar{position:absolute;bottom:0;left:0;right:0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10;backdrop-filter:blur(4px);background:rgba(0,0,0,.45)}
.affbar-txt{font-size:10px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.affbar-btn{font-size:10px;font-weight:500;padding:5px 12px;border-radius:20px;flex-shrink:0;margin-left:8px;cursor:pointer;text-decoration:none;display:inline-block}
/* export */
.eov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.em{background:var(--surface);border:0.5px solid var(--border-md);border-radius:14px;padding:28px 32px;width:500px;max-width:90vw}
.em h2{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:6px}
.em p{font-size:13px;color:var(--text-2);margin-bottom:20px;line-height:1.5}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.eopt{border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;background:transparent;text-align:left;font-family:'DM Sans',sans-serif;color:var(--text);transition:all .15s}
.eopt:hover{border-color:var(--accent);background:var(--accent-bg)}
.eopt.aff:hover{border-color:var(--green);background:var(--green-bg)}
.eopt-ic{font-size:22px;margin-bottom:6px}
.eopt-ti{font-size:13px;font-weight:500;margin-bottom:2px}
.eopt-de{font-size:11px;color:var(--text-3)}
.ecl{width:100%;padding:10px;border:0.5px solid var(--border-md);border-radius:var(--radius-sm);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text-2);cursor:pointer;transition:all .15s}
.ecl:hover{background:var(--surface2);color:var(--text)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--surface2);border:0.5px solid var(--border-md);border-radius:20px;padding:10px 20px;font-size:13px;color:var(--text);z-index:200;transition:transform .25s ease;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
/* TEMPLATE MODAL */
.tov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px)}
.tm{background:var(--surface);border:0.5px solid var(--border-md);border-radius:16px;padding:28px 32px;width:720px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;gap:0}
.tm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tm-head h2{font-family:'Playfair Display',serif;font-size:20px}
.tm-head p{font-size:12px;color:var(--text-3);margin-top:3px}
.tm-close{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:20px;padding:4px;border-radius:6px;transition:all .15s}
.tm-close:hover{color:var(--text);background:var(--surface2)}
.tm-filters{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tf{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;border:0.5px solid var(--border);background:transparent;color:var(--text-3);cursor:pointer;transition:all .15s}
.tf:hover{border-color:var(--border-md);color:var(--text-2)}
.tf.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow-y:auto;padding-right:4px;flex:1}
.tm-grid::-webkit-scrollbar{width:3px}
.tm-grid::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:2px}
.tcard{border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;background:var(--surface2)}
.tcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tcard-preview{height:90px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.tcard-slides{display:flex;gap:4px;padding:8px;width:100%}
.tcard-slide{flex:1;height:74px;border-radius:5px;overflow:hidden;display:flex;align-items:flex-end;padding:6px;font-size:5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tcard-body{padding:10px 12px 12px}
.tcard-niche{font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;opacity:.5}
.tcard-name{font-size:13px;font-weight:500;margin-bottom:2px}
.tcard-desc{font-size:11px;color:var(--text-3);line-height:1.4}
.tcard-slides-count{font-size:10px;color:var(--text-3);margin-top:6px}
.tcard-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:10px;font-weight:500;margin-right:3px;margin-top:4px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo"><span>◈</span> Carousel Generator</div>
  <div class="aff-badge">Affiliate Ready</div>
  <div class="topbar-sep"></div>
  <span class="topbar-count" id="top-count"></span>
  <button class="topbar-btn" onclick="openTemplates()">✦ Templates</button>
  <button class="topbar-btn" onclick="openExport()">↗ Exportieren</button>
</div>

<div class="workspace">
  <div class="sidebar">
    <div class="sidebar-title">Folien</div>
    <div class="slides-list" id="slides-list"></div>
    <button class="add-btn" onclick="addSlide()">+ Folie hinzufügen</button>
  </div>
  <div class="canvas-area">
    <div class="canvas-nav">
      <button class="nav-arrow" id="prev" onclick="navigate(-1)">&#8592;</button>
      <div class="slide-frame" id="slide-frame"></div>
      <button class="nav-arrow" id="next" onclick="navigate(1)">&#8594;</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="props-panel" id="props-panel"></div>
</div>

<div class="eov" id="eov" style="display:none" onclick="closeExport(event)">
  <div class="em">
    <h2>Exportieren</h2>
    <p>Für Affiliate-Einsatz: HTML-Export enthält alle Links als klickbare Elemente mit <code>rel="sponsored"</code>.</p>
    <div class="egrid">
      <button class="eopt aff" onclick="exportAffHTML()">
        <div class="eopt-ic">🔗</div>
        <div class="eopt-ti">Affiliate HTML</div>
        <div class="eopt-de">Mit Links & Tracking-Attributen</div>
      </button>
      <button class="eopt" onclick="exportJSON()">
        <div class="eopt-ic">💾</div>
        <div class="eopt-ti">Projekt speichern</div>
        <div class="eopt-de">JSON mit Bildern & Links</div>
      </button>
      <button class="eopt" onclick="importJSON()">
        <div class="eopt-ic">📂</div>
        <div class="eopt-ti">Projekt laden</div>
        <div class="eopt-de">JSON-Datei importieren</div>
      </button>
      <button class="eopt" onclick="copyEmbedCode()">
        <div class="eopt-ic">📋</div>
        <div class="eopt-ti">Embed-Code kopieren</div>
        <div class="eopt-de">Für WordPress & Co.</div>
      </button>
    </div>
    <button class="ecl" onclick="closeExport()">Abbrechen</button>
  </div>
</div>

<!-- TEMPLATE MODAL -->
<div class="tov" id="tov" style="display:none" onclick="closeTpl(event)">
  <div class="tm">
    <div class="tm-head">
      <div>
        <h2>✦ Nischen-Templates</h2>
        <p>Fertige Carousel-Sets — einfach laden und Texte & Links anpassen</p>
      </div>
      <button class="tm-close" onclick="closeTpl()">✕</button>
    </div>
    <div class="tm-filters" id="tm-filters"></div>
    <div class="tm-grid" id="tm-grid"></div>
  </div>
</div>

<input type="file" id="file-input" accept=".json" style="display:none" onchange="loadJSON(event)" />
<input type="file" id="img-input" accept="image/*" style="display:none" onchange="loadImage(event)" />
<div class="toast" id="toast"></div>

<script>
const COLORS={
  dark:    {bg:'#1a1a2e',text:'#f0f0f0',accent:'#e94560',name:'Dunkel'},
  indigo:  {bg:'#1e1b4b',text:'#e0e7ff',accent:'#a5b4fc',name:'Indigo'},
  forest:  {bg:'#1a2e1e',text:'#ecfdf5',accent:'#6ee7b7',name:'Wald'},
  ember:   {bg:'#2d1700',text:'#fff7ed',accent:'#fb923c',name:'Ember'},
  slate:   {bg:'#0f172a',text:'#f1f5f9',accent:'#38bdf8',name:'Slate'},
  rose:    {bg:'#2d0f1a',text:'#fff1f2',accent:'#f9a8d4',name:'Rose'},
  ivory:   {bg:'#faf7f0',text:'#1c1917',accent:'#92400e',name:'Elfenbein'},
  charcoal:{bg:'#1c1c1c',text:'#f5f5f5',accent:'#d4af37',name:'Charcoal'},
};
const RATIOS={
  '1:1':{w:480,h:480,fw:10,fh:10},
  '4:5':{w:440,h:550,fw:10,fh:12},
  '9:16':{w:340,h:600,fw:10,fh:17},
};
const TYPES={cover:'Cover',content:'Inhalt',product:'Produkt',stat:'Statistik',quote:'Zitat',cta:'CTA',list:'Liste'};
const FIELDS={
  cover:   [{k:'eyebrow',l:'Eyebrow'},{k:'title',l:'Haupttitel'},{k:'subtitle',l:'Untertitel'}],
  content: [{k:'eyebrow',l:'Nummer'},{k:'title',l:'Überschrift'},{k:'body',l:'Text',multi:true}],
  product: [{k:'eyebrow',l:'Marke'},{k:'title',l:'Produktname'},{k:'subtitle',l:'Preis (z.B. 49,99 €)'},{k:'body',l:'Alter Preis / Rabatt'},{k:'ctaText',l:'Button-Text'}],
  stat:    [{k:'title',l:'Zahl / Wert'},{k:'eyebrow',l:'Label'},{k:'body',l:'Beschreibung',multi:true}],
  quote:   [{k:'title',l:'Zitat',multi:true},{k:'eyebrow',l:'Autor'}],
  cta:     [{k:'eyebrow',l:'Handle / Label'},{k:'title',l:'Titel'},{k:'subtitle',l:'Button-Text'},{k:'body',l:'Zusatz'}],
  list:    [{k:'eyebrow',l:'Label'},{k:'title',l:'Überschrift'},{k:'body',l:'Punkte (je Zeile)',multi:true}],
};

let slides=[
  {id:1,type:'cover',color:'dark',title:'Die 5 besten Produkte 2025',subtitle:'Affiliate Guide',eyebrow:'Top Picks',body:'',image:'',affLink:'',affLabel:'Jetzt ansehen',showAffBar:false,ctaText:'Jetzt kaufen'},
  {id:2,type:'product',color:'dark',title:'Sony WH-1000XM5',subtitle:'299,00 €',eyebrow:'Sony',body:'UVP 379 €',image:'',affLink:'https://amzn.to/beispiel',affLabel:'Bei Amazon kaufen',showAffBar:true,ctaText:'Zum Deal →'},
  {id:3,type:'content',color:'dark',title:'Warum wir es empfehlen',eyebrow:'01',body:'Nach 30 Tagen Nutzung überzeugt es durch Akkulaufzeit, Klang und Komfort. Unser klarer Favorit im Test.',image:'',affLink:'',affLabel:'Mehr erfahren',showAffBar:false,ctaText:''},
  {id:4,type:'cta',color:'dark',title:'Alle Links in der Bio',eyebrow:'@deinHandle',body:'Täglich neue Deals & Empfehlungen.',subtitle:'Link in Bio ↗',image:'',affLink:'',affLabel:'',showAffBar:false,ctaText:''},
];
let current=0,ratio='1:1',nextId=10;

function s(){return slides[current]}
function e(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function renderAll(){
  renderSidebar();renderCanvas();renderDots();renderProps();
  document.getElementById('top-count').textContent=slides.length+' Folie'+(slides.length===1?'':'n');
  const p=document.getElementById('prev'),n=document.getElementById('next');
  current===0?p.setAttribute('disabled',''):p.removeAttribute('disabled');
  current===slides.length-1?n.setAttribute('disabled',''):n.removeAttribute('disabled');
}

function renderSidebar(){
  document.getElementById('slides-list').innerHTML=slides.map((sl,i)=>{
    const c=COLORS[sl.color];
    return`<div class="slide-thumb ${i===current?'active':''}" onclick="selectSlide(${i})">
      <span class="thumb-num">${String(i+1).padStart(2,'0')}</span>
      <div class="thumb-preview" style="background:${c.bg};${sl.image?`background-image:url(${sl.image});background-size:cover;background-position:center`:''}">
        ${!sl.image?`<span style="font-size:6px;font-weight:700;color:${c.accent};letter-spacing:1px">${sl.type.toUpperCase()}</span>`:''}
        ${sl.image?'<div class="thumb-img-dot"></div>':''}
        ${sl.affLink?'<div class="thumb-link-dot"></div>':''}
      </div>
      <div class="thumb-meta">
        <div class="thumb-title">${sl.title||'—'}</div>
        <div class="thumb-type">${TYPES[sl.type]||sl.type}${sl.affLink?' 🔗':''}</div>
      </div>
      <div class="thumb-actions">
        ${i>0?`<button class="tact mv" onclick="mv(event,${i},-1)">↑</button>`:''}
        ${i<slides.length-1?`<button class="tact mv" onclick="mv(event,${i},1)">↓</button>`:''}
        ${slides.length>1?`<button class="tact" onclick="del(event,${i})">✕</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderCanvas(){
  const r=RATIOS[ratio];
  const fr=document.getElementById('slide-frame');
  fr.style.width=r.w+'px';fr.style.height=r.h+'px';
  fr.innerHTML=buildSlide(s(),r.w,r.h,current+1,slides.length);
}

function fz(w){return Math.round(w*0.075)}

function buildSlide(sl,w,h,num,tot){
  const c=COLORS[sl.color];
  const base=`background:${c.bg};color:${c.text};width:${w}px;height:${h}px;`;
  const nb=`<div class="snum" style="color:${c.text}">${num}/${tot}</div>`;
  const hl=fz(w);
  const hasBg=!!sl.image;
  const bgLayers=hasBg
    ?`<div class="sbgi" style="background-image:url(${sl.image})"></div><div class="sbgo" style="background:${c.bg};opacity:0.55"></div>`:'';
  const bar=sl.showAffBar&&sl.affLink
    ?`<div class="affbar"><span class="affbar-txt" style="color:#fff">🔗 ${e(sl.affLabel||sl.affLink)}</span><a class="affbar-btn" href="${e(sl.affLink)}" target="_blank" rel="noopener sponsored" style="background:${c.accent};color:${c.bg}">${e(sl.affLabel||'Zum Deal')}</a></div>`
    :'';

  if(sl.type==='cover'){
    return`<div class="sw" style="${base}">${bgLayers}
      ${!hasBg?`<div class="dcc" style="background:${c.accent};width:${w*.55}px;height:${w*.55}px;right:${-w*.15}px;top:${-w*.15}px;opacity:.07"></div>`:''}
      <div class="scz"><div class="sc">${nb}
        <div class="ey" style="color:${c.accent}">${e(sl.eyebrow||'')}</div>
        <div class="hl" style="font-size:${hl}px">${e(sl.title||'')}</div>
        <div class="su" style="font-size:${Math.round(w*.033)}px">${e(sl.subtitle||'')}</div>
      </div></div>${bar}</div>`;
  }
  if(sl.type==='content'){
    return`<div class="sw" style="${base}">${bgLayers}
      <div class="scz"><div class="sct">${nb}
        <div class="lb">${e(sl.eyebrow||'')}</div>
        <div class="br" style="background:${c.accent}"></div>
        <div class="hd" style="font-size:${Math.round(hl*.72)}px">${e(sl.title||'')}</div>
        <div class="bt">${(sl.body||'').replace(/\n/g,'<br>')}</div>
      </div></div>${bar}</div>`;
  }
  if(sl.type==='product'){
    return`<div class="sw sprod" style="${base}">${nb}
      <div class="pi" style="${hasBg?`background-image:url(${sl.image})`:`background:${c.bg}`}">
        ${!hasBg?`<div class="pip" style="color:${c.text}">Bild hochladen</div>`:''}
        <div class="pbadge" style="background:${c.accent};color:${c.bg}">${e(sl.eyebrow||'Marke')}</div>
      </div>
      <div class="pinfo" style="background:${c.bg}">
        <div class="pname" style="font-size:${Math.round(w*.044)}px">${e(sl.title||'Produktname')}</div>
        <div style="display:flex;align-items:baseline">
          <span class="pprice" style="color:${c.accent}">${e(sl.subtitle||'0,00 €')}</span>
          ${sl.body?`<span class="pold" style="color:${c.text}">${e(sl.body)}</span>`:''}
        </div>
        ${sl.affLink
          ?`<a class="pcta" href="${e(sl.affLink)}" target="_blank" rel="noopener sponsored" style="background:${c.accent};color:${c.bg}">${e(sl.ctaText||'Zum Deal →')}</a>`
          :`<div class="pcta" style="background:${c.accent};color:${c.bg}">${e(sl.ctaText||'Zum Deal →')}</div>`}
      </div>${bar}</div>`;
  }
  if(sl.type==='stat'){
    return`<div class="sw" style="${base}">${bgLayers}
      <div class="scz"><div class="sst">${nb}
        <div class="big" style="font-size:${Math.round(w*.16)}px;color:${c.accent}">${e(sl.title||'0')}</div>
        <div class="lb">${e(sl.eyebrow||'')}</div>
        <div class="desc">${(sl.body||'').replace(/\n/g,'<br>')}</div>
      </div></div>${bar}</div>`;
  }
  if(sl.type==='quote'){
    return`<div class="sw" style="${base}">${bgLayers}
      <div class="scz"><div class="sqt">${nb}
        <div class="qm" style="color:${c.accent}">"</div>
        <div class="qt" style="font-size:${Math.round(w*.048)}px">${e(sl.title||'')}</div>
        <div class="au" style="color:${c.accent}">${e(sl.eyebrow||'')}</div>
      </div></div>${bar}</div>`;
  }
  if(sl.type==='cta'){
    return`<div class="sw" style="${base}">${bgLayers}
      <div class="scz"><div class="scta">${nb}
        <div class="in">${e(sl.eyebrow||'')}</div>
        <div class="ti" style="font-size:${Math.round(hl*.78)}px">${e(sl.title||'')}</div>
        ${sl.affLink
          ?`<a class="pill" href="${e(sl.affLink)}" target="_blank" rel="noopener sponsored" style="background:${c.accent};color:${c.bg}">${e(sl.subtitle||'Jetzt ansehen')}</a>`
          :`<div class="pill" style="background:${c.accent};color:${c.bg}">${e(sl.subtitle||'Jetzt ansehen')}</div>`}
        <div class="hnd">${e(sl.body||'')}</div>
      </div></div>${bar}</div>`;
  }
  if(sl.type==='list'){
    const its=(sl.body||'').split('\n').filter(l=>l.trim());
    return`<div class="sw" style="${base}">${bgLayers}
      <div class="scz"><div class="sls">${nb}
        <div class="lb">${e(sl.eyebrow||'')}</div>
        <div class="hd" style="font-size:${Math.round(hl*.62)}px">${e(sl.title||'')}</div>
        <div class="its">${its.map(it=>`<div class="it"><div class="idot" style="background:${c.accent}"></div><div>${e(it)}</div></div>`).join('')}</div>
      </div></div>${bar}</div>`;
  }
  return '';
}

function renderDots(){
  document.getElementById('dots').innerHTML=slides.map((_,i)=>
    `<div class="dot ${i===current?'active':''}" onclick="selectSlide(${i})"></div>`).join('');
}

function renderProps(){
  const sl=s();
  const lbs=Object.keys(TYPES).map(t=>`
    <button class="lbtn ${t==='product'?'prod':''} ${sl.type===t?'active':''}" onclick="setType('${t}')">
      <div class="lic">${TYPES[t][0]}</div>${TYPES[t]}
    </button>`).join('');
  const cds=Object.entries(COLORS).map(([k,c])=>`
    <div class="cdot ${sl.color===k?'active':''}" style="background:${c.bg};border:1.5px solid ${c.accent};box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)" onclick="setColor('${k}')" title="${c.name}"></div>`).join('');
  const fbs=Object.entries(RATIOS).map(([k,r])=>`
    <button class="fbtn ${ratio===k?'active':''}" onclick="setRatio('${k}')">
      <div class="fpreview" style="width:${r.fw}px;height:${r.fh}px"></div>${k}
    </button>`).join('');
  const flds=(FIELDS[sl.type]||[]).map(f=>`
    <div class="fgroup">
      <label class="flabel">${f.l}</label>
      ${f.multi
        ?`<textarea class="finput" rows="3" oninput="upd('${f.k}',this.value)">${sl[f.k]||''}</textarea>`
        :`<input class="finput" type="text" value="${e(sl[f.k]||'')}" oninput="upd('${f.k}',this.value)">`}
    </div>`).join('');
  const hasLink=sl.affLink&&sl.affLink.length>0;

  document.getElementById('props-panel').innerHTML=`
    <div class="psec"><div class="psec-title">Layout</div><div class="layout-grid">${lbs}</div></div>
    <div class="psec"><div class="psec-title">Farbpalette</div><div class="color-row">${cds}</div></div>
    <div class="psec"><div class="psec-title">Format</div><div class="format-row">${fbs}</div></div>
    <div class="psec">
      <div class="psec-title">Hintergrundbild</div>
      <div class="img-drop ${sl.image?'has':''}" onclick="triggerImg()" id="imgarea">
        ${sl.image
          ?`<img src="${sl.image}" alt=""><button class="img-rm" onclick="rmImg(event)">✕</button>`
          :`<div class="img-ilabel">📷 Bild hochladen</div><div class="img-isub">JPG, PNG, WEBP</div>`}
      </div>
    </div>
    <div class="psec" style="padding-bottom:14px"><div class="psec-title">Inhalt</div>${flds}</div>
    <div class="psec aff">
      <div class="psec-title" style="color:var(--green)">🔗 Affiliate Link</div>
      <div class="fgroup">
        <label class="flabel">Link-URL</label>
        <input class="finput link" type="url" placeholder="https://amzn.to/..." value="${e(sl.affLink||'')}" oninput="updAff('affLink',this.value)">
        ${hasLink?`<div class="link-preview"><div class="lpdot"></div>${e(sl.affLink)}</div>`:''}
      </div>
      <div class="fgroup">
        <label class="flabel">Button-Text</label>
        <input class="finput" type="text" placeholder="z.B. Bei Amazon kaufen" value="${e(sl.affLabel||'')}" oninput="upd('affLabel',this.value)">
      </div>
      <div class="toggle-row">
        <span class="toggle-lbl">Link-Bar auf Folie zeigen</span>
        <label class="tog">
          <input type="checkbox" ${sl.showAffBar?'checked':''} onchange="upd('showAffBar',this.checked)">
          <div class="tog-sl"></div>
        </label>
      </div>
    </div>`;
}

function selectSlide(i){current=i;renderAll()}
function navigate(d){const n=current+d;if(n>=0&&n<slides.length){current=n;renderAll()}}
function setType(t){slides[current].type=t;renderAll()}
function setColor(c){slides[current].color=c;renderAll()}
function setRatio(r){ratio=r;renderAll()}
function upd(k,v){slides[current][k]=v;renderCanvas();renderSidebar()}
function updAff(k,v){slides[current][k]=v;renderCanvas();renderSidebar();renderProps()}
function addSlide(){
  slides.push({id:nextId++,type:'content',color:s().color,title:'Neue Folie',eyebrow:String(slides.length+1).padStart(2,'0'),body:'Dein Inhalt hier…',subtitle:'',image:'',affLink:'',affLabel:'Jetzt ansehen',showAffBar:false,ctaText:'Zum Deal →'});
  current=slides.length-1;renderAll();
}
function del(ev,i){ev.stopPropagation();if(slides.length<=1)return;slides.splice(i,1);if(current>=slides.length)current=slides.length-1;renderAll()}
function mv(ev,i,d){ev.stopPropagation();const j=i+d;if(j<0||j>=slides.length)return;[slides[i],slides[j]]=[slides[j],slides[i]];if(current===i)current=j;else if(current===j)current=i;renderAll()}

function triggerImg(){document.getElementById('img-input').click()}
function rmImg(ev){ev.stopPropagation();slides[current].image='';renderAll()}
function loadImage(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{slides[current].image=e.target.result;renderAll();showToast('Bild geladen ✓')};
  r.readAsDataURL(f);ev.target.value='';
}

function openExport(){document.getElementById('eov').style.display='flex'}
function closeExport(ev){if(!ev||ev.target===document.getElementById('eov'))document.getElementById('eov').style.display='none'}
function exportJSON(){
  dl('carousel.json','application/json',JSON.stringify({slides,ratio},null,2));
  showToast('Projekt gespeichert ✓');closeExport();
}
function importJSON(){document.getElementById('file-input').click();closeExport()}
function loadJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.slides){slides=d.slides;ratio=d.ratio||ratio;current=0;renderAll();showToast('Projekt geladen ✓')}}catch{showToast('Ungültige Datei')}};
  r.readAsText(f);ev.target.value='';
}

function buildExportHTML(){
  const r=RATIOS[ratio];
  const body=slides.map((sl,i)=>`<div class="cs" style="display:${i===0?'block':'none'}">${buildSlide(sl,r.w,r.h,i+1,slides.length)}</div>`).join('\n');
  return`<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>Carousel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#111;font-family:'DM Sans',sans-serif}.cs{border-radius:12px;overflow:hidden}#carousel{position:relative;display:inline-block}.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}.nav.p{left:-48px}.nav.n{right:-48px}.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}.dot{width:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);cursor:pointer;transition:all .2s}.dot.a{width:24px;background:#fff}
.sw,.sc,.sct,.sprod,.sst,.sqt,.scta,.sls{font-family:'DM Sans',sans-serif}.sw{position:relative;overflow:hidden}.sbgi{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}.sbgo{position:absolute;inset:0;z-index:1}.scz{position:relative;z-index:2;width:100%;height:100%}.snum{position:absolute;top:16px;right:16px;font-size:10px;opacity:.3;z-index:3}.sc{display:flex;flex-direction:column;justify-content:flex-end;padding:40px 44px;height:100%}.sc .ey{font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;opacity:.7;margin-bottom:14px}.sc .hl{font-family:'Playfair Display',serif;font-weight:700;line-height:1.1;margin-bottom:14px}.sc .su{font-weight:300;line-height:1.5;opacity:.75}.dcc{position:absolute;border-radius:50%;z-index:0}.sct{display:flex;flex-direction:column;padding:38px 44px;height:100%}.sct .lb{font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.4;margin-bottom:16px}.sct .br{height:2px;border-radius:1px;width:36px;margin-bottom:18px;opacity:.5}.sct .hd{font-family:'Playfair Display',serif;font-weight:700;line-height:1.2;margin-bottom:14px}.sct .bt{font-size:14px;line-height:1.7;opacity:.75;font-weight:300;flex:1}.sprod{display:flex;flex-direction:column;height:100%}.sprod .pi{flex:1;background-size:cover;background-position:center;position:relative;overflow:hidden;min-height:50%}.sprod .pip{width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:.2;font-size:13px;text-transform:uppercase}.sprod .pbadge{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase}.sprod .pinfo{padding:20px 24px;display:flex;flex-direction:column;gap:6px}.sprod .pname{font-family:'Playfair Display',serif;font-weight:700;line-height:1.2}.sprod .pprice{font-size:18px;font-weight:500}.sprod .pold{font-size:12px;text-decoration:line-through;opacity:.4;margin-left:6px}.sprod .pcta{display:inline-flex 0;margin-top:5px}.affbar{position:absolute;bottom:0;left:0;right:0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10;backdrop-filter:blur(4px);background:rgba(0,0,0,.45)}.affbar-txt{font-size:10px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.affbar-btn{font-size:10px;font-weight:500;padding:5px 12px;border-radius:20px;flex-shrink:0;margin-left:8px;text-decoration:none;display:inline-block}
</style></head><body>
<div id="carousel">
${body}
<button class="nav p" onclick="prev()">&#8592;</button>
<button class="nav n" onclick="next()">&#8594;</button>
</div>
<div class="dots" id="dots">${slides.map((_,i)=>`<div class="dot ${i===0?'a':''}" onclick="go(${i})"></div>`).join('')}</div>
<script>var ci=0,sl=document.querySelectorAll('.cs'),dt=document.querySelectorAll('.dot');
function show(i){sl.forEach((s,j)=>{s.style.display=j===i?'block':'none'});dt.forEach((d,j)=>{d.className='dot'+(j===i?' a':'')});ci=i}
function prev(){if(ci>0)show(ci-1)}function next(){if(ci<sl.length-1)show(ci+1)}function go(i){show(i)}
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowLeft')prev();if(ev.key==='ArrowRight')next()});
<\/script></body></html>`;
}

function exportAffHTML(){
  dl('carousel-affiliate.html','text/html',buildExportHTML());
  showToast('Affiliate HTML exportiert ✓');closeExport();
}
function copyEmbedCode(){
  navigator.clipboard.writeText(buildExportHTML()).then(()=>showToast('Code kopiert ✓'));
  closeExport();
}
function dl(name,type,content){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name;a.click();
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);
}

function renderTemplateModal(){
  const niches=['Alle',...new Set(TEMPLATES.map(t=>t.niche))];
  document.getElementById('tm-filters').innerHTML=niches.map(n=>
    `<button class="tf ${tplFilter===n?'active':''}" onclick="setTplFilter('${n}')">${n}</button>`).join('');
  const filtered=tplFilter==='Alle'?TEMPLATES:TEMPLATES.filter(t=>t.niche===tplFilter);
  document.getElementById('tm-grid').innerHTML=filtered.map(tpl=>{
    const previews=tpl.slides.slice(0,3).map(sl=>{
      const c=COLORS[sl.color];
      return`<div class="tcard-slide" style="background:${c.bg};color:${c.text}"><span style="color:${c.accent}">${sl.type.toUpperCase()}</span></div>`;
    }).join('');
    const tags=tpl.tags.map(t=>`<span class="tcard-tag" style="background:var(--accent-bg);color:var(--accent)">${t}</span>`).join('');
    return`<div class="tcard" onclick="loadTemplate('${tpl.id}')">
      <div class="tcard-preview" style="background:${COLORS[tpl.color].bg}">
        <div class="tcard-slides">${previews}</div>
      </div>
      <div class="tcard-body">
        <div class="tcard-niche">${tpl.niche}</div>
        <div class="tcard-name">${tpl.name}</div>
        <div class="tcard-desc">${tpl.desc}</div>
        <div style="margin-top:6px">${tags}<span class="tcard-tag" style="background:var(--surface);color:var(--text-3)">${tpl.slides.length} Folien</span></div>
      </div>
    </div>`;
  }).join('');
}

function setTplFilter(n){tplFilter=n;renderTemplateModal()}
function loadTemplate(id){
  const tpl=TEMPLATES.find(t=>t.id===id);if(!tpl)return;
  slides=tpl.slides.map(sl=>({...sl,id:nextId++}));
  current=0;ratio='4:5';renderAll();
  document.getElementById('tov').style.display='none';
  showToast(`"${tpl.name}" geladen — Links jetzt anpassen ✓`);
}

renderAll();
</script>
</body>
